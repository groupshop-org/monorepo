version: "3"

includes:
  config:
    taskfile: ../config.yml
    flatten: true

tasks:
  dev:
    desc: "Startup the local Solana validator for development"
    cmds:
      - >
        solana-test-validator
        --quiet
        --reset
        --rpc-port {{.PORT_SOLANA_VALIDTOR_DEV_RPC}}
        --faucet-port {{.PORT_SOLANA_VALIDTOR_DEV_FAUCET}}
        --gossip-port {{.PORT_SOLANA_VALIDTOR_DEV_GOSSIP}}

  fund:
    desc: "Fund a wallet on the local Solana validator"
    cmds:
      - >
        solana airdrop 1000 --url http://localhost:{{.PORT_SOLANA_VALIDTOR_DEV_RPC}} {{.SOLANA_WALLET_DEV}}
