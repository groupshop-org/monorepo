version: "3"

includes:
  config:
    taskfile: ../config.yml
    flatten: true

vars:
  PATH_TRUNK_DIST_LANDING: '{{joinPath .PATH_TRUNK_DIST "landing"}}'

tasks:
  ensure-pages-project:
    desc: "Ensure the landing Cloudflare Pages project exists"
    env:
      CLOUDFLARE_API_TOKEN: "{{.CLOUDFLARE_DEPLOY_API_TOKEN}}"
    cmds:
      - |
        set -euo pipefail
        PROJECT="{{.CF_PAGES_PROJECT_LANDING}}"
        if wrangler pages project list --json | jq -e --arg project "$PROJECT" '.[] | select(."Project Name" == $project)' >/dev/null; then
          echo "Cloudflare Pages project exists: $PROJECT"
        else
          wrangler pages project create "$PROJECT" --production-branch "{{.CF_PAGES_BRANCH_LANDING}}"
        fi

  prepare-wallet-bridge:
    internal: true
    cmds:
      - npm run build:landing-wallet

  prepare-solana-config:
    internal: true
    cmds:
      - task solana-programs:write-frontend-config

  build:
    desc: "Build the landing page for production"
    deps: ["prepare-wallet-bridge", "prepare-solana-config"]
    dir: "{{.PATH_PACKAGE_LANDING}}"
    env:
      URL_API: "{{.URL_API_PROD}}"
      URL_MEDIA: "/media"
      URL_ADMIN: "{{.URL_ADMIN_PROD}}"
    cmds:
      - task solana-programs:require-deploy-config
      - >
        SOLANA_NETWORK="{{.SOLANA_NETWORK_DEPLOY}}"
        NO_COLOR=true trunk build
        --release
        --dist "{{.PATH_TRUNK_DIST_LANDING}}"
      - cp -r "{{.PATH_MEDIA_LANDING}}" "{{.PATH_TRUNK_DIST_LANDING}}/media"

  dev:
    desc: "Run the landing page in development mode"
    deps: ["prepare-wallet-bridge", "prepare-solana-config", "dev-trunk", "dev-media"]
    cmds:
      - task solana-programs:bootstrap-local

  dev-trunk:
    internal: true
    dir: "{{.PATH_PACKAGE_LANDING}}"
    env:
      URL_API: "{{.URL_API_DEV}}"
      URL_MEDIA: "{{.URL_LANDING_MEDIA_DEV}}"
      URL_ADMIN: "{{.URL_ADMIN_DEV}}"
      SOLANA_NETWORK: "{{.SOLANA_NETWORK_ACTIVE}}"
    cmds:
      - >
        NO_COLOR=true trunk serve
        --poll
        --port {{.PORT_LANDING_DEV}}
        --dist "{{.PATH_TRUNK_DIST_LANDING}}"
        --watch "{{.PATH_PACKAGE_FRONTEND_SHARED}}"
        --watch "{{.PATH_ROOT_CARGO_TOML}}"
        --watch "."

  dev-media:
    internal: true
    dir: "{{.PATH_MEDIA_LANDING}}"
    cmds:
      - http-server --cors -p {{.PORT_LANDING_MEDIA_DEV}}

  deploy:
    desc: "Deploy the landing page to Cloudflare Pages"
    deps: ["build"]
    env:
      CLOUDFLARE_API_TOKEN: "{{.CLOUDFLARE_DEPLOY_API_TOKEN}}"
    cmds:
      - task: ensure-pages-project
      - >
        wrangler pages deploy "{{.PATH_TRUNK_DIST_LANDING}}"
        --project-name="{{.CF_PAGES_PROJECT_LANDING}}"
        --branch "{{.CF_PAGES_BRANCH_LANDING}}"
