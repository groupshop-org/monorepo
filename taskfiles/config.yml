version: "3"

vars:
  # PATHS
  PATH_REPO_ROOT:
    sh: git rev-parse --show-toplevel
  PATH_PACKAGES_FRONTEND: '{{joinPath .PATH_REPO_ROOT "packages" "frontend"}}'
  PATH_PACKAGES_BACKEND: '{{joinPath .PATH_REPO_ROOT "packages" "backend"}}'
  PATH_PACKAGES_SOLANA_PROGRAMS: '{{joinPath .PATH_REPO_ROOT "packages" "solana-programs"}}'
  PATH_CLOUDFLARE_API: '{{joinPath .PATH_REPO_ROOT "cloudflare" "api"}}'
  PATH_CLOUDFLARE_API_WRANGLER_CONFIG: '{{joinPath .PATH_CLOUDFLARE_API "wrangler.jsonc"}}'
  PATH_TRUNK_DIST: '{{joinPath .PATH_REPO_ROOT ".trunk-dist"}}'
  PATH_ROOT_CARGO_TOML: '{{joinPath .PATH_REPO_ROOT "Cargo.toml"}}'
  PATH_PACKAGE_FRONTEND_SHARED: '{{joinPath .PATH_PACKAGES_FRONTEND "frontend-shared"}}'
  PATH_PACKAGE_LANDING: '{{joinPath .PATH_PACKAGES_FRONTEND "landing"}}'
  PATH_PACKAGE_ADMIN: '{{joinPath .PATH_PACKAGES_FRONTEND "admin"}}'
  PATH_PACKAGE_API: '{{joinPath .PATH_PACKAGES_BACKEND "api"}}'
  PATH_CLOUDFLARE_HEALTH: '{{joinPath .PATH_REPO_ROOT "cloudflare" "health"}}'
  PATH_CLOUDFLARE_HEALTH_WRANGLER_CONFIG: '{{joinPath .PATH_CLOUDFLARE_HEALTH "wrangler.jsonc"}}'
  PATH_PACKAGE_HEALTH_BACKEND: '{{joinPath .PATH_PACKAGES_BACKEND "health"}}'
  PATH_PACKAGE_HEALTH_DASHBOARD: '{{joinPath .PATH_PACKAGES_FRONTEND "health"}}'
  PATH_DB_DEV: '{{joinPath .PATH_CLOUDFLARE_API "db" "local" "dev"}}'
  PATH_TARGET_DEPLOY: '{{joinPath .PATH_REPO_ROOT "target" "deploy"}}'
  PATH_DEPLOYMENTS_LOCAL: '{{joinPath .PATH_REPO_ROOT ".deployments" "local"}}'
  PATH_DEPLOYMENTS_DEVNET: '{{joinPath .PATH_REPO_ROOT ".deployments" "devnet"}}'
  PATH_DEPLOYMENT_MARKET_PROGRAM_LOCAL: '{{joinPath .PATH_DEPLOYMENTS_LOCAL "market-program.json"}}'
  PATH_DEPLOYMENT_MARKET_PROGRAM_DEVNET: '{{joinPath .PATH_DEPLOYMENTS_DEVNET "market-program.json"}}'
  PATH_DEPLOYMENT_MARKET_PROGRAM_KEYPAIR_DEVNET: '{{joinPath .PATH_DEPLOYMENTS_DEVNET "market-program-keypair.json"}}'
  PATH_DEPLOYMENT_USDC_MINT_LOCAL: '{{joinPath .PATH_DEPLOYMENTS_LOCAL "usdc-mint.json"}}'
  PATH_DEPLOYMENT_USDC_MINT_KEYPAIR_LOCAL: '{{joinPath .PATH_DEPLOYMENTS_LOCAL "usdc-mint-keypair.json"}}'
  PATH_LANDING_SOLANA_DEPLOYMENTS: '{{joinPath .PATH_PACKAGE_LANDING "assets" "solana-deployments.json"}}'
  PATH_SUPPLIER_DATA: '{{joinPath .PATH_REPO_ROOT ".." "suppliers-data"}}'

  # MEDIA
  PATH_MEDIA_LANDING: '{{joinPath .PATH_REPO_ROOT "media" "landing"}}'

  # PORTS
  PORT_API_DEV: 9081
  PORT_LANDING_DEV: 9082
  PORT_LANDING_MEDIA_DEV: 9083
  PORT_SOLANA_VALIDTOR_DEV_GOSSIP: 9084
  PORT_SOLANA_VALIDTOR_DEV_FAUCET: 9085
  PORT_SOLANA_VALIDTOR_DEV_RPC: 9086
  PORT_SOLANA_VALIDTOR_DEV_WEBSOCKET: 9087 # Automatically one after RPC
  PORT_HEALTH_DEV: 9088
  PORT_HEALTH_DASHBOARD_DEV: 9089
  PORT_ADMIN_DEV: 9090

  # URLS
  URL_API_DEV: "http://127.0.0.1:{{.PORT_API_DEV}}"
  URL_API_PROD: "https://api.groupshop.org"
  URL_LANDING_DEV: "http://127.0.0.1:{{.PORT_LANDING_DEV}}"
  URL_LANDING_PROD: "https://groupshop.org"
  URL_LANDING_MEDIA_DEV: "http://localhost:{{.PORT_LANDING_MEDIA_DEV}}"
  URL_SOLANA_VALIDATOR_RPC_DEV: "http://localhost:{{.PORT_SOLANA_VALIDTOR_DEV_RPC}}"
  URL_HEALTH_DEV: "http://localhost:{{.PORT_HEALTH_DEV}}"
  URL_HEALTH_DASHBOARD_DEV: "http://localhost:{{.PORT_HEALTH_DASHBOARD_DEV}}"
  URL_HEALTH_PROD:
    sh: printf "%s" "${URL_HEALTH_PROD:-https://health-api.groupshop.org}"
  URL_HEALTH_DASHBOARD_PROD:
    sh: printf "%s" "${URL_HEALTH_DASHBOARD_PROD:-https://health.groupshop.org}"
  URL_ADMIN_DEV: "http://127.0.0.1:{{.PORT_ADMIN_DEV}}"
  URL_ADMIN_PROD:
    sh: printf "%s" "${URL_ADMIN_PROD:-https://admin.groupshop.org}"
  URL_LANDING_MEDIA_PROD: "https://groupshop.org/media"

  # CLOUDFLARE BINDINGS
  CF_BINDING_DB: "DB_GROUPSHOP"
  CF_BINDING_DO_AUTH_TOKEN_REFRESH: "DO_GROUPSHOP_AUTH_TOKEN_REFRESH"
  CF_BINDING_DO_AUTH_TOKEN_ONCE: "DO_GROUPSHOP_AUTH_TOKEN_ONCE"
  CF_PAGES_PROJECT_LANDING: "groupshop-landing"
  CF_PAGES_PROJECT_ADMIN: "groupshop-admin"
  CF_PAGES_PROJECT_HEALTH: "groupshop-health"
  CF_PAGES_BRANCH_LANDING:
    sh: printf "%s" "${CF_PAGES_BRANCH_LANDING:-main}"
  CF_PAGES_BRANCH_ADMIN:
    sh: printf "%s" "${CF_PAGES_BRANCH_ADMIN:-prod}"
  CF_PAGES_BRANCH_HEALTH:
    sh: printf "%s" "${CF_PAGES_BRANCH_HEALTH:-prod}"

  # AUTH / EMAIL
  API_ALLOWED_ORIGINS_DEV: "{{.URL_LANDING_DEV}},{{.URL_ADMIN_DEV}}"
  API_OPENID_GOOGLE_REDIRECT_URI_DEV: "{{.URL_API_DEV}}/auth/openid-access-token-hook/google"
  API_OPENID_GOOGLE_REDIRECT_URI_PROD: "{{.URL_API_PROD}}/auth/openid-access-token-hook/google"
  API_POSTMARK_FROM_EMAIL: "notifications@groupshop.org"
  API_POSTMARK_MESSAGE_STREAM: "outbound"

  # SOLANA TARGET SELECTION
  SOLANA_NETWORK_ACTIVE:
    sh: printf "%s" "${SOLANA_NETWORK:-local}"
  SOLANA_RPC_URL_DEVNET:
    sh: printf "%s" "${SOLANA_RPC_URL_DEVNET:-https://api.devnet.solana.com}"
  # Client-facing RPC returned in responses and embedded in the frontend manifest.
  # Defaults to SOLANA_RPC_URL_DEVNET. Set this to the public endpoint when
  # SOLANA_RPC_URL_DEVNET points to a private provider that blocks browser/Phantom access.
  SOLANA_RPC_URL_CLIENT_DEVNET:
    sh: printf "%s" "${SOLANA_RPC_URL_CLIENT_DEVNET:-${SOLANA_RPC_URL_DEVNET:-https://api.devnet.solana.com}}"
  SOLANA_MARKET_PROGRAM_ID_DEVNET:
    sh: |
      if [ -n "${SOLANA_MARKET_PROGRAM_ID_DEVNET:-}" ]; then
        printf "%s" "$SOLANA_MARKET_PROGRAM_ID_DEVNET"
      elif [ -f "{{.PATH_DEPLOYMENT_MARKET_PROGRAM_DEVNET}}" ]; then
        jq -r '.programId // ""' "{{.PATH_DEPLOYMENT_MARKET_PROGRAM_DEVNET}}"
      else
        printf ""
      fi
  SOLANA_USDC_MINT_DEVNET:
    sh: printf "%s" "${SOLANA_USDC_MINT_DEVNET:-4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU}"
  SOLANA_WALLET_DEV:
    sh: printf "%s" "${SOLANA_WALLET_DEV:-}"
  SOLANA_DEPLOY_KEYPAIR:
    sh: printf "%s" "${SOLANA_DEPLOY_KEYPAIR:-{{.HOME}}/.config/solana/groupshop-devnet-deploy.json}"
  SOLANA_AUTHORITY_KEYPAIR:
    sh: printf "%s" "${SOLANA_AUTHORITY_KEYPAIR:-{{.HOME}}/.config/solana/id.json}"
  SOLANA_NETWORK_DEPLOY:
    sh: printf "%s" "${SOLANA_NETWORK_DEPLOY:-devnet}"
  SOLANA_RPC_URL_DEPLOY:
    sh: |
      if [ "{{.SOLANA_NETWORK_DEPLOY}}" = "devnet" ]; then
        printf "%s" "{{.SOLANA_RPC_URL_DEVNET}}"
      else
        echo "unsupported SOLANA_NETWORK_DEPLOY={{.SOLANA_NETWORK_DEPLOY}}; expected devnet" >&2
        exit 1
      fi
  SOLANA_RPC_URL_CLIENT_DEPLOY:
    sh: |
      if [ "{{.SOLANA_NETWORK_DEPLOY}}" = "devnet" ]; then
        printf "%s" "{{.SOLANA_RPC_URL_CLIENT_DEVNET}}"
      else
        echo "unsupported SOLANA_NETWORK_DEPLOY={{.SOLANA_NETWORK_DEPLOY}}; expected devnet" >&2
        exit 1
      fi
  SOLANA_MARKET_PROGRAM_ID_DEPLOY:
    sh: |
      if [ "{{.SOLANA_NETWORK_DEPLOY}}" = "devnet" ]; then
        printf "%s" "{{.SOLANA_MARKET_PROGRAM_ID_DEVNET}}"
      else
        echo "unsupported SOLANA_NETWORK_DEPLOY={{.SOLANA_NETWORK_DEPLOY}}; expected devnet" >&2
        exit 1
      fi
  SOLANA_USDC_MINT_DEPLOY:
    sh: |
      if [ "{{.SOLANA_NETWORK_DEPLOY}}" = "devnet" ]; then
        printf "%s" "{{.SOLANA_USDC_MINT_DEVNET}}"
      else
        echo "unsupported SOLANA_NETWORK_DEPLOY={{.SOLANA_NETWORK_DEPLOY}}; expected devnet" >&2
        exit 1
      fi
  SOLANA_AUTHORITY_KEYPAIR_JSON_LOCAL:
    sh: cat "{{.HOME}}/.config/solana/id.json"
  SOLANA_MARKET_PROGRAM_ID_LOCAL:
    sh: |
      if [ -f "{{.PATH_DEPLOYMENT_MARKET_PROGRAM_LOCAL}}" ]; then
        jq -r '.programId // ""' "{{.PATH_DEPLOYMENT_MARKET_PROGRAM_LOCAL}}"
      else
        printf ""
      fi
  SOLANA_USDC_MINT_LOCAL:
    sh: |
      if [ -f "{{.PATH_DEPLOYMENT_USDC_MINT_LOCAL}}" ]; then
        jq -r '.mint // ""' "{{.PATH_DEPLOYMENT_USDC_MINT_LOCAL}}"
      else
        printf ""
      fi
  SOLANA_RPC_URL_ACTIVE:
    sh: |
      if [ "{{.SOLANA_NETWORK_ACTIVE}}" = "local" ]; then
        printf "%s" "{{.URL_SOLANA_VALIDATOR_RPC_DEV}}"
      else
        printf "%s" "{{.SOLANA_RPC_URL_DEVNET}}"
      fi
  SOLANA_MARKET_PROGRAM_ID_ACTIVE:
    sh: |
      if [ "{{.SOLANA_NETWORK_ACTIVE}}" = "local" ]; then
        printf "%s" "{{.SOLANA_MARKET_PROGRAM_ID_LOCAL}}"
      else
        printf "%s" "{{.SOLANA_MARKET_PROGRAM_ID_DEVNET}}"
      fi
  SOLANA_USDC_MINT_ACTIVE:
    sh: |
      if [ "{{.SOLANA_NETWORK_ACTIVE}}" = "local" ]; then
        printf "%s" "{{.SOLANA_USDC_MINT_LOCAL}}"
      else
        printf "%s" "{{.SOLANA_USDC_MINT_DEVNET}}"
      fi
