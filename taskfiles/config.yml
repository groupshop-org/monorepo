version: "3"

vars:
  # PATHS
  PATH_REPO_ROOT:
    sh: git rev-parse --show-toplevel
  PATH_PACKAGES_FRONTEND: '{{joinPath .PATH_REPO_ROOT "packages" "frontend"}}'
  PATH_PACKAGES_BACKEND: '{{joinPath .PATH_REPO_ROOT "packages" "backend"}}'
  PATH_CLOUDFLARE_API: '{{joinPath .PATH_REPO_ROOT "cloudflare" "api"}}'
  PATH_CLOUDFLARE_API_WRANGLER_CONFIG: '{{joinPath .PATH_CLOUDFLARE_API "wrangler.jsonc"}}'
  PATH_TRUNK_DIST: '{{joinPath .PATH_REPO_ROOT ".trunk-dist"}}'
  PATH_ROOT_CARGO_TOML: '{{joinPath .PATH_REPO_ROOT "Cargo.toml"}}'
  PATH_PACKAGE_FRONTEND_SHARED: '{{joinPath .PATH_PACKAGES_FRONTEND "frontend-shared"}}'
  PATH_PACKAGE_LANDING: '{{joinPath .PATH_PACKAGES_FRONTEND "landing"}}'
  PATH_PACKAGE_API: '{{joinPath .PATH_PACKAGES_BACKEND "api"}}'
  PATH_DB_DEV: '{{joinPath .PATH_CLOUDFLARE_API "db" "local" "dev"}}'

  # MEDIA
  PATH_MEDIA_LANDING: '{{joinPath .PATH_REPO_ROOT "media" "landing"}}'

  # PORTS
  PORT_API_DEV: 9081
  PORT_LANDING_DEV: 9082
  PORT_LANDING_MEDIA_DEV: 9083

  # URLS
  URL_API_DEV: "http://127.0.0.1:{{.PORT_API_DEV}}"
  URL_API_PROD: "https://api.groupshop.com"
  URL_LANDING_DEV: "http://127.0.0.1:{{.PORT_LANDING_DEV}}"
  URL_LANDING_PROD: "https://groupshop.com"
  URL_LANDING_MEDIA_DEV: "http://localhost:{{.PORT_LANDING_MEDIA_DEV}}"

  # CLOUDFLARE BINDINGS
  CF_BINDING_DB: "DB_GROUPSHOP"
