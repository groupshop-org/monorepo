version: "3"

includes:
  config:
    taskfile: ../config.yml
    flatten: true

tasks:
  dev:
    desc: "Run the backend API in development mode"
    deps: ["build-dev-once"]
    cmds:
      - task solana-programs:bootstrap-local
      - task: dev-inner

  deploy:
    desc: "Deploy the backend API worker to Cloudflare"
    deps: ["build-release"]
    env:
      CLOUDFLARE_API_TOKEN: "{{.CLOUDFLARE_DEPLOY_API_TOKEN}}"
    cmds:
      - >
        wrangler deploy
        -c "{{.PATH_CLOUDFLARE_API_WRANGLER_CONFIG}}"
        --env prod
        --var "SOLANA_NETWORK:{{.SOLANA_NETWORK_ACTIVE}}"
        --var "SOLANA_RPC_URL:{{.SOLANA_RPC_URL_ACTIVE}}"
        --var "SOLANA_MARKET_PROGRAM_ID:{{.SOLANA_MARKET_PROGRAM_ID_ACTIVE}}"
        --var "SOLANA_USDC_MINT:{{.SOLANA_USDC_MINT_ACTIVE}}"

  build-dev-once:
    internal: true
    dir: "{{.PATH_PACKAGE_API}}"
    cmds:
      - worker-build --dev

  build-release:
    internal: true
    dir: "{{.PATH_PACKAGE_API}}"
    cmds:
      - worker-build --release

  dev-inner:
    internal: true
    deps: ["watch-dev", "wrangler-dev"]

  watch-dev:
    internal: true
    dir: "{{.PATH_PACKAGE_API}}"
    cmds:
      - >
        watchexec
        -w "{{.PATH_ROOT_CARGO_TOML}}"
        -w "{{.PATH_PACKAGE_API}}"
        worker-build --dev

  wrangler-dev:
    internal: true
    env:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: true
    cmds:
      - >
        wrangler dev
        -c "{{.PATH_CLOUDFLARE_API_WRANGLER_CONFIG}}"
        --env dev
        --local
        --log-level info
        --show-interactive-dev-session=false
        --persist-to="{{.PATH_DB_DEV}}"
        --port {{.PORT_API_DEV}}
        --var "DB_BINDING:{{.CF_BINDING_DB}}"
        --var "APP_ENV:dev"
        --var "ALLOWED_ORIGINS:{{.API_ALLOWED_ORIGINS_DEV}}"
        --var "AUTH_COOKIE_SAMESITE:none"
        --var "DO_BINDING_AUTH_TOKEN_REFRESH:{{.CF_BINDING_DO_AUTH_TOKEN_REFRESH}}"
        --var "DO_BINDING_AUTH_TOKEN_ONCE:{{.CF_BINDING_DO_AUTH_TOKEN_ONCE}}"
        --var "OPENID_GOOGLE_REDIRECT_URI:{{.API_OPENID_GOOGLE_REDIRECT_URI_DEV}}"
        --var "URL_LANDING:{{.URL_LANDING_DEV}}"
        --var "POSTMARK_FROM_EMAIL:{{.API_POSTMARK_FROM_EMAIL}}"
        --var "POSTMARK_MESSAGE_STREAM:{{.API_POSTMARK_MESSAGE_STREAM}}"
        --var "SOLANA_NETWORK:{{.SOLANA_NETWORK_ACTIVE}}"
        --var "SOLANA_RPC_URL:{{.SOLANA_RPC_URL_ACTIVE}}"
        --var "SOLANA_MARKET_PROGRAM_ID:{{.SOLANA_MARKET_PROGRAM_ID_ACTIVE}}"
        --var "SOLANA_USDC_MINT:{{.SOLANA_USDC_MINT_ACTIVE}}"
        --var "SOLANA_AUTHORITY_KEYPAIR_JSON:{{.SOLANA_AUTHORITY_KEYPAIR_JSON_LOCAL}}"
