[workspace]
members = ["packages/backend/*", "packages/frontend/*", "packages/frontend/admin", "packages/solana-programs/*", "packages/cli"]
resolver = "2"

[workspace.package]
description = "groupshop"
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["David Komer"]
rust-version = "1.80.0"

[workspace.dependencies]
groupshop-backend-shared = { path = "packages/backend/backend-shared" }
groupshop-frontend-shared = { path = "packages/frontend/frontend-shared" }

# Frontend
dominator = "0.5.38"
futures-signals = "0.3"
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.6", features = ["http"] }
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3.82", features = [
    "Crypto",
    "CryptoKey",
    "Document",
    "Element",
    "Headers",
    "HmacImportParams",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "ReadableStream",
    "ReadableStreamDefaultController",
    "RequestCredentials",
    "Response",
    "Storage",
    "SubtleCrypto",
    "Url",
    "Window",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WASM utilities
js-sys = "0.3"
bytes = "1"
wasm-streams = "0.5"
futures-util = "0.3"

# Cloudflare
worker = { version = "0.7.5", features = ["d1", "http"] }

# HTTP / errors / encoding
http = "1"
thiserror = "2"
base64 = "0.22"
const-hex = "1"
urlencoding = "2"

# Crypto / randomness
argon2 = "0.5"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Solana (on-chain)
pinocchio = {version = "0.11.1", features = ["cpi"]}
pinocchio-system = "0.6"
pinocchio-token = "0.6"
solana-program-log = "1.1.0"

# Hashing (used by both on-chain and backend)
sha2 = { version = "0.10", default-features = false }

# Solana (client)
solana-sdk = "2"
solana-client = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
csv = "1"
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1", features = ["full"] }
